@if (!isDropDown()) {
  <div class="wallpaper-ships min-h-screen w-full">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-0 w-full">
      @for (item of ships(); track $index) {
        <div
          [routerLink]="['/selected-space-ship', item.id]"
          class="group relative aspect-2/1 w-full overflow-hidden cursor-pointer"
        >
          <img
            [ngSrc]="item.backgroundImage"
            fill
            priority
            class="object-cover transition-transform duration-700 ease-out group-hover:scale-105"
          />

          <div
            class="absolute inset-0 bg-linear-to-t from-black/70 via-black/20 to-transparent opacity-80 transition-opacity duration-300 group-hover:opacity-95"
          ></div>

          <div class="absolute inset-0 flex items-end justify-start p-6 md:p-10 z-10">
            <h3 class="text-white text-xl md:text-2xl font-medium tracking-wide drop-shadow-sm">
              {{ item.title || 'Unnamed Ship' }}
            </h3>
          </div>
        </div>
      }
    </div>
  </div>
} @else {
  <div class="ships-panel">
    @for (item of ships(); track $index) {
      <a
        mat-menu-item
        [routerLink]="['/selected-space-ship', item.id]"
        class="nav-link"
      >
        {{ item.title || 'Unnamed Ship' }}
      </a>
    }
  </div>
}
